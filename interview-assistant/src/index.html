<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试助手</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>面试助手</h1>
            <p>AI 驱动的面试准备工具</p>
        </header>
        
        <main>
            <section class="feature-section">
                <h2>功能</h2>
                <div class="features">
                    <div class="feature-card">
                        <h3>模拟面试</h3>
                        <p>根据职位要求生成面试问题，提供实时反馈</p>
                    </div>
                    <div class="feature-card">
                        <h3>问题库</h3>
                        <p>包含常见面试问题和参考答案</p>
                    </div>
                    <div class="feature-card">
                        <h3>简历分析</h3>
                        <p>分析简历与职位的匹配度</p>
                    </div>
                </div>
            </section>
            
            <section class="input-section">
                <h2>开始模拟面试</h2>
                <form id="interview-form">
                    <div class="form-group">
                        <label for="job-title">职位名称</label>
                        <input type="text" id="job-title" placeholder="例如：前端开发工程师">
                    </div>
                    <div class="form-group">
                        <label for="job-description">职位描述</label>
                        <textarea id="job-description" placeholder="粘贴职位描述..."></textarea>
                    </div>
                    <button type="submit" class="btn">开始面试</button>
                </form>
            </section>
            
            <section class="interview-section" id="interview-section" style="display: none;">
                <h2>模拟面试</h2>
                <div class="question-card" id="question-card">
                    <h3 id="question-title">问题</h3>
                    <p id="question-content">加载中...</p>
                    <div class="tips" id="question-tips"></div>
                </div>
                <div class="answer-section">
                    <textarea id="answer-input" placeholder="输入你的答案..."></textarea>
                    <div class="answer-actions">
                        <button id="submit-answer" class="btn">提交答案</button>
                        <button id="skip-question" class="btn btn-secondary">跳过</button>
                    </div>
                </div>
                <div class="feedback" id="feedback" style="display: none;"></div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2026 面试助手</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
