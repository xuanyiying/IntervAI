name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # GHCR 镜像名必须小写；统一在这里生成，供推送与远端 compose 共用
      - name: Resolve image references
        id: images
        run: |
          PREFIX=$(printf '%s/%s' "${{ env.REGISTRY }}" "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${PREFIX}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${PREFIX}/frontend" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ steps.images.outputs.backend }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ steps.images.outputs.frontend }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./packages/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v8
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: '${{ github.event.inputs.environment || 'production' }}',
              auto_merge: false,
              required_contexts: [],
            });
            return deployment.id;

      # 手动触发选 staging / production；push 到 main 或 v* tag 一律部署 production
      - name: Deploy to staging
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_STAGING }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER_STAGING }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_STAGING }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}:${{ steps.version.outputs.version }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}:${{ steps.version.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && \
            export BACKEND_IMAGE=$BACKEND_IMAGE && \
            export FRONTEND_IMAGE=$FRONTEND_IMAGE && \
            docker compose --env-file .env.production -f deployment/docker-compose.prod.yml pull backend frontend && \
            docker compose --env-file .env.production -f deployment/docker-compose.prod.yml up -d && \
            docker image prune -f"

      - name: Deploy to production
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_PRODUCTION }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PRODUCTION }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER_PRODUCTION }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_PRODUCTION }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}:${{ steps.version.outputs.version }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}:${{ steps.version.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && \
            export BACKEND_IMAGE=$BACKEND_IMAGE && \
            export FRONTEND_IMAGE=$FRONTEND_IMAGE && \
            docker compose --env-file .env.production -f deployment/docker-compose.prod.yml pull backend frontend && \
            docker compose --env-file .env.production -f deployment/docker-compose.prod.yml up -d && \
            docker image prune -f"

      - name: Update Deployment Status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const deploymentId = ${{ steps.create_deployment.outputs.result }};
            const jobStatus = '${{ job.status }}';
            const state = jobStatus === 'success' ? 'success' : (jobStatus === 'failure' ? 'failure' : 'error');

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: state,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Deployment ${{ needs.deploy.result }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Deployment ${{ needs.deploy.result == 'success' && 'Succeeded ✅' || 'Failed ❌' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ github.event.inputs.environment || 'production' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Action Logs"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
