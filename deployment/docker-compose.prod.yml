# Production Environment Configuration
# Run with: docker compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database - Production
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Performance tuning
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 256MB
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: always
    ports:
      - "127.0.0.1:5432:5432" # Localhost only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./backups/postgres:/backups
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Redis Cache - Production
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
    ports:
      - "127.0.0.1:6379:6379" # Localhost only
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: [ "CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: always
    logging: *logging
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # Backend API Service - Production
  backend:
    build:
      context: ..
      dockerfile: packages/backend/Dockerfile
      args:
        NODE_ENV: production
    # CI 推送镜像时由 BACKEND_IMAGE 覆盖；本地构建使用 intervai/backend:local
    image: ${BACKEND_IMAGE:-intervai/backend:local}
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      APP_EDITION: ${APP_EDITION:-oss}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      AI_MODEL: ${AI_MODEL:-deepseek:deepseek-chat}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-siliconcloud:BAAI/bge-m3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SILICONCLOUD_API_KEY: ${SILICONCLOUD_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OSS_TYPE: ${OSS_TYPE:-MINIO}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-minio:9000}
      OSS_PORT: 9000
      OSS_REGION: ${OSS_REGION:-us-east-1}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-minioadmin}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-minioadmin}
      OSS_BUCKET: ${OSS_BUCKET:-resume-files}
      OSS_APP_ID: ${OSS_APP_ID:-}
      OSS_PUBLIC_ENDPOINT: ${OSS_PUBLIC_ENDPOINT:-}
      OSS_PATH_STYLE: ${OSS_PATH_STYLE:-true}
      OSS_SECURE: ${OSS_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_ENABLE: ${OTEL_ENABLE:-false}
      OTEL_OTLP_URL: ${OTEL_OTLP_URL:-http://localhost:4318/v1/traces}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    restart: always
    logging: *logging
    deploy:
      # replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Frontend Web Application - Production
  frontend:
    build:
      context: ..
      dockerfile: packages/frontend/Dockerfile
    image: ${FRONTEND_IMAGE:-intervai/frontend:local}
    container_name: frontend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_dist:/app/dist
    networks:
      - app-network
    restart: always
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: [ "CMD", "/health.sh" ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Caddy Reverse Proxy with Automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/var/www/html:ro
      - ./logs/caddy:/var/log/caddy
    environment:
      - DOMAIN=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - ACME_CA=${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    networks:
      - app-network
    restart: always
    logging: *logging
    healthcheck:
      test: [ "CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile" ]
      interval: 30s
      timeout: 10s
      retries: 3
  
volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  frontend_dist:

networks:
  app-network:
    driver: bridge
